# nfpm packaging config for deb/rpm/archlinux — read by `wails3 tool package`.
# The .desktop file and icon paths match what the linux Taskfile stages:
# the binary, the icon and the desktop entry land under their conventional
# system locations so desktop environments pick the app up on install.
name: "zopresent"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Scripture-first worship presentation for a single operator and one audience display."
vendor: "Zowesoft"
license: "Proprietary"
release: "1"

contents:
  - src: "./bin/zopresent"
    dst: "/usr/local/bin/zopresent"
  # The bundled speech engine, staged by `task engines:stage`. Installs to a
  # read-only FHS location; discovery falls back to it when nothing sits
  # beside the executable. Staged by the packaging tasks, so it is always
  # present when the package is built.
  - src: "./build/engines"
    dst: "/usr/local/lib/zopresent/engines"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/zopresent.png"
  - src: "./build/linux/zopresent.desktop"
    dst: "/usr/share/applications/zopresent.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
