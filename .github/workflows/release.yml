# Release packaging: build the installers for every desktop OS on their native
# runners and attach them to the GitHub release. Triggered by pushing a tag
# like `v0.1.0`. Signing is deliberately not wired — packages are unsigned
# until certificates exist (Windows Authenticode / macOS Developer ID).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Kept in step with the wails/v3 version in go.mod.
  WAILS_VERSION: v3.0.0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      # NSIS is not preinstalled on the amd64 Windows runner images, so the
      # installer step needs the compiler provisioned explicitly.
      - name: Install NSIS
        uses: nsis-dev/setup-nsis@v1
        with:
          version: "latest"
      - name: Package (NSIS installer, engine staged and bundled)
        shell: bash
        run: wails3 task package INSTALL_SCOPE=machine
      - uses: actions/upload-artifact@v4
        with:
          name: zowe-worship-windows
          path: build/windows/nsis/zowe-worship-installer.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The GTK4 + WebKitGTK 6.0 stack must be present before the Wails CLI
      # installs: compiling the CLI on Linux already links against GTK, so the
      # libraries have to exist in pkg-config's search path first.
      - name: Install GTK/WebKitGTK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Package (deb / rpm / AppImage)
        run: |
          # The AUR tarball is skipped: archlinux packaging wants pacman
          # tooling the ubuntu runner does not have; deb/rpm/AppImage cover
          # the supported distributions.
          wails3 task linux:create:appimage
          wails3 task linux:create:deb
          wails3 task linux:create:rpm
      - uses: actions/upload-artifact@v4
        with:
          name: zowe-worship-linux
          path: |
            bin/*.deb
            bin/*.rpm
            bin/*.AppImage
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Package (.app bundle, ad-hoc signed)
        run: wails3 task darwin:package
      - uses: actions/upload-artifact@v4
        with:
          name: zowe-worship-macos
          path: bin/zowe-worship.app
          if-no-files-found: error

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.zip
