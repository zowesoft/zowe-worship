version: '3'

vars:
  APP_NAME: "zowe-worship"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

# Zowe Worship targets every desktop OS Wails v3 supports — Windows packaging
# lives in ./build/windows today; other platform Taskfiles join as those
# packaging targets come online.
includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image for server mode deployment
    cmds:
      - task: common:run:docker

  asr:bench:fetch:
    summary: Downloads whisper.cpp CPU binaries and the tiny.en smoke model into benchmarks/
    cmds:
      - powershell -ExecutionPolicy Bypass -File benchmarks/fetch.ps1

  asr:bench:
    summary: Runs the spoken-reference benchmark, detector-only mode (see benchmarks/README.md)
    cmds:
      - go run ./cmd/asr-bench -set benchmarks/sample-set {{.FLAGS}}

  asr:bench:whisper:
    summary: Example engine run — whisper.cpp tiny.en over the sample set
    cmds:
      - go run ./cmd/asr-bench -set benchmarks/sample-set
        -engine "whisper.tiny=benchmarks/tools/Release/whisper-cli.exe -m benchmarks/models/ggml-tiny.en.bin -np -f {audio}"

  asr:bench:moonshine:
    summary: Engine run — Moonshine tiny (int8) via sherpa-onnx
    cmds:
      - go run ./cmd/asr-bench -set benchmarks/smoke-set
        -engine "moonshine.tiny=benchmarks/tools/sherpa-onnx-v2.0.1-win-x64-shared-MT-Release/bin/sherpa-onnx-offline.exe --moonshine-preprocessor=benchmarks/models/moonshine-tiny-en-int8/preprocess.onnx --moonshine-encoder=benchmarks/models/moonshine-tiny-en-int8/encode.int8.onnx --moonshine-uncached-decoder=benchmarks/models/moonshine-tiny-en-int8/uncached_decode.int8.onnx --moonshine-cached-decoder=benchmarks/models/moonshine-tiny-en-int8/cached_decode.int8.onnx --tokens=benchmarks/models/moonshine-tiny-en-int8/tokens.txt {audio}"

  asr:bench:parakeet:
    summary: Engine run — Parakeet TDT 0.6B v3 (int8) via sherpa-onnx
    cmds:
      - go run ./cmd/asr-bench -set benchmarks/smoke-set
        -engine "parakeet.v3=benchmarks/tools/sherpa-onnx-v2.0.1-win-x64-shared-MT-Release/bin/sherpa-onnx-offline.exe --encoder=benchmarks/models/parakeet-tdt-0.6b-v3-int8/encoder.int8.onnx --decoder=benchmarks/models/parakeet-tdt-0.6b-v3-int8/decoder.int8.onnx --joiner=benchmarks/models/parakeet-tdt-0.6b-v3-int8/joiner.int8.onnx --tokens=benchmarks/models/parakeet-tdt-0.6b-v3-int8/tokens.txt {audio}"
